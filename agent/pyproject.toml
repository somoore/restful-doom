[project]
name = "restfuldoom-agent"
version = "0.1.0"
description = "Python agent client for RESTful Doom gRPC mode."
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  "numpy>=2.0",
  "protobuf>=4.25",
  "torch>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
