syntax = "proto3";

package restfuldoom.v1;

// DoomAgent streams game state and receives player commands.
service DoomAgent {
  // Runs a bidirectional observe-act loop.
  rpc GameSession(stream PlayerAction) returns (stream GameState);

  // Streams observations without sending actions.
  rpc Observe(ObserveRequest) returns (stream GameState);

  // Requests a fresh episode reset on Doom's simulation thread.
  rpc ResetEpisode(ResetEpisodeRequest) returns (ResetEpisodeResponse);
}

// Configures an observation-only stream.
message ObserveRequest {
  // When true, each state includes a prost-encoded StateDelta payload.
  bool include_delta_state = 1;
}

// Episode reset request for training loops.
message ResetEpisodeRequest {
  // Doom skill level. Values are clamped by the engine.
  int32 skill = 1;

  // Doom episode number. Defaults to E1 when zero.
  int32 episode = 2;

  // Doom map number. Defaults to M1 when zero.
  int32 map = 3;

  // Optional training seed. Current engine bridge reports whether it applied it.
  uint64 seed = 4;

  // Optional caller run identifier for logs and trajectory correlation.
  string run_id = 5;

  // Optional curriculum start applied after the fresh level reset.
  EpisodeStart start = 6;
}

// Optional post-reset curriculum start for focused learning.
message EpisodeStart {
  // Target player map position. If omitted, the normal map spawn is used.
  Vec3Fixed position = 1;

  // Target player facing when face_nearest_enemy is false.
  uint32 angle_degrees = 2;

  // When true, face the nearest living enemy after the optional teleport.
  bool face_nearest_enemy = 3;

  // Optional player resources applied only when apply_resources is true.
  int32 health = 4;
  int32 armor = 5;
  Ammo ammo = 6;

  // Applies health, armor, and ammo values when true.
  bool apply_resources = 7;
}

// Reset acceptance details from the gRPC bridge.
message ResetEpisodeResponse {
  // True when the request was queued for Doom's simulation thread.
  bool accepted = 1;

  // Human-readable status for demos and training logs.
  string message = 2;

  // Values that were queued after bridge-side normalization.
  int32 skill = 3;
  int32 episode = 4;
  int32 map = 5;

  // Echoes the requested seed.
  uint64 seed = 6;

  // True only when the engine bridge applies the requested seed.
  bool seed_applied = 7;

  // True when an optional EpisodeStart was queued with the reset.
  bool start_queued = 8;
}

// A full game-state observation optimized for AI agents.
message GameState {
  // Doom simulation tic that produced this observation.
  uint64 tick = 1;

  // Console player state.
  PlayerState player = 2;

  // Living enemies, bounded and ordered by internal thinker traversal.
  repeated EnemyInfo enemies = 3;

  // Useful non-player objects such as pickups, missiles, and shootable actors.
  repeated MapObjectState objects = 4;

  // Level metadata and progress counters.
  LevelInfo level = 5;

  // Prost-encoded StateDelta from the prior message on this stream.
  bytes delta_state = 6;

  // True when delta_state was computed against the prior streamed state.
  bool has_delta_state = 7;

  // Local navigation affordances around the player.
  NavigationProbe navigation = 8;

  // Weapon-line affordances for deciding when to fire.
  CombatProbe combat = 9;
}

// A compact delta from one streamed state to the next.
message StateDelta {
  uint64 base_tick = 1;
  uint64 tick = 2;
  bool player_changed = 3;
  PlayerState player = 4;
  repeated EnemyInfo changed_enemies = 5;
  repeated int32 removed_enemy_ids = 6;
  repeated MapObjectState changed_objects = 7;
  repeated int32 removed_object_ids = 8;
  LevelInfo level = 9;
  bool level_changed = 10;
  NavigationProbe navigation = 11;
  bool navigation_changed = 12;
  CombatProbe combat = 13;
  bool combat_changed = 14;
}

// Player statistics and inventory.
message PlayerState {
  MapObjectState object = 1;
  int32 health = 2;
  int32 armor = 3;
  int32 kills = 4;
  int32 items = 5;
  int32 secrets = 6;
  Weapon ready_weapon = 7;
  uint32 owned_weapons = 8;
  Ammo ammo = 9;
  uint32 key_cards = 10;
  uint32 cheat_flags = 11;
  int32 last_attacked_by = 12;
  bool active = 13;
}

// Ammunition counts.
message Ammo {
  int32 bullets = 1;
  int32 shells = 2;
  int32 cells = 3;
  int32 rockets = 4;
}

// Weapon identifiers follow Doom's internal weapon order.
enum Weapon {
  WEAPON_FIST = 0;
  WEAPON_PISTOL = 1;
  WEAPON_SHOTGUN = 2;
  WEAPON_CHAINGUN = 3;
  WEAPON_ROCKET = 4;
  WEAPON_PLASMA = 5;
  WEAPON_BFG = 6;
  WEAPON_CHAINSAW = 7;
  WEAPON_SUPER_SHOTGUN = 8;
}

// Generic map object state.
message MapObjectState {
  int32 id = 1;
  Vec3Fixed position = 2;
  uint32 angle_degrees = 3;
  sfixed32 height_fp = 4;
  int32 health = 5;
  int32 type_id = 6;
  int32 internal_type = 7;
  uint32 flags = 8;
  int32 attacking_id = 9;
  sfixed32 distance_fp = 10;
}

// Enemy state extends map object state with agent-relevant threat data.
message EnemyInfo {
  MapObjectState object = 1;
  bool line_of_sight = 2;
  int32 target_id = 3;
}

// Level metadata and progress counters.
message LevelInfo {
  int32 episode = 1;
  int32 map = 2;
  int32 skill = 3;
  int32 level_time = 4;
  int32 total_kills = 5;
  int32 total_items = 6;
  int32 total_secrets = 7;
  int32 gamestate = 8;
}

// Cheap local movement probes for agent navigation.
message NavigationProbe {
  bool forward_open = 1;
  bool back_open = 2;
  bool left_open = 3;
  bool right_open = 4;
  bool use_line_ahead = 5;
  int32 front_blocking_line_special = 6;
  sfixed32 front_block_distance_fp = 7;
  sfixed32 probe_distance_fp = 8;
  repeated DirectionProbe direction_probes = 9;
  repeated UseLineInfo use_lines = 10;
  SectorProbe current_sector = 11;
  RouteWaypoint route_waypoint = 12;
}

// One local movement ray relative to the player's current angle.
message DirectionProbe {
  sint32 angle_offset_degrees = 1;
  bool open = 2;
  sfixed32 block_distance_fp = 3;
  int32 blocking_line_special = 4;
  bool use_line_ahead = 5;
}

// Nearby special line that can usually be activated with USE.
message UseLineInfo {
  int32 line_id = 1;
  Vec3Fixed midpoint = 2;
  int32 special = 3;
  int32 tag = 4;
  sfixed32 distance_fp = 5;
  Vec3Fixed start = 6;
  Vec3Fixed end = 7;
  Vec3Fixed nearest_point = 8;
  sfixed32 nearest_distance_fp = 9;
}

// Current sector affordances relevant to navigation and damage avoidance.
message SectorProbe {
  int32 sector_id = 1;
  int32 special = 2;
  sfixed32 floor_height_fp = 3;
  sfixed32 ceiling_height_fp = 4;
  int32 light_level = 5;
  bool damaging = 6;
  int32 damage_per_32_tics = 7;
  bool exit_damage = 8;
}

// A cheap route target for progression-aware learning.
message RouteWaypoint {
  UseLineInfo line = 1;
  int32 priority = 2;
  bool exit = 3;
  bool walk_trigger = 4;
}

// Cheap weapon-line target probe for agent combat decisions.
message CombatProbe {
  bool has_shootable_target = 1;
  int32 target_id = 2;
  int32 target_health = 3;
  sfixed32 target_distance_fp = 4;
  sfixed32 aim_slope_fp = 5;
  sfixed32 range_fp = 6;
  bool target_is_enemy = 7;
}

// Fixed-point Doom world position.
message Vec3Fixed {
  sfixed32 x_fp = 1;
  sfixed32 y_fp = 2;
  sfixed32 z_fp = 3;
}

// A command from an agent to Doom.
message PlayerAction {
  // Optional target tic for analysis and replay.
  uint64 tick = 1;

  // High-level action for simple agents.
  PlayerActionType action = 2;

  // Action-specific amount. Defaults to 10 for movement and turning.
  uint32 amount = 3;

  // Optional duration; bounded by the server.
  uint32 duration_tics = 4;

  // Low-level ticcmd overlay for precise policy control.
  RawTiccmd raw = 5;

  // Optional key-style controls that compose into the raw ticcmd.
  repeated KeyPress keys = 6;

  // Optional mouse-style input that composes into angle and forward movement.
  MouseInput mouse = 7;
}

// High-level action names match the REST API vocabulary.
enum PlayerActionType {
  ACTION_UNSPECIFIED = 0;
  ACTION_FORWARD = 1;
  ACTION_BACKWARD = 2;
  ACTION_TURN_LEFT = 3;
  ACTION_TURN_RIGHT = 4;
  ACTION_STRAFE_LEFT = 5;
  ACTION_STRAFE_RIGHT = 6;
  ACTION_SHOOT = 7;
  ACTION_USE = 8;
  ACTION_SWITCH_WEAPON = 9;
}

// Key controls for simple command construction.
message KeyPress {
  DoomKey key = 1;
  bool pressed = 2;
}

// Agent-facing keys independent of host keyboard layout.
enum DoomKey {
  DOOM_KEY_UNSPECIFIED = 0;
  DOOM_KEY_FORWARD = 1;
  DOOM_KEY_BACKWARD = 2;
  DOOM_KEY_TURN_LEFT = 3;
  DOOM_KEY_TURN_RIGHT = 4;
  DOOM_KEY_STRAFE_LEFT = 5;
  DOOM_KEY_STRAFE_RIGHT = 6;
  DOOM_KEY_SHOOT = 7;
  DOOM_KEY_USE = 8;
}

// Mouse-style input values.
message MouseInput {
  sint32 turn = 1;
  sint32 forward = 2;
  uint32 buttons = 3;
}

// Raw ticcmd overlay.
message RawTiccmd {
  sint32 forward_move = 1;
  sint32 side_move = 2;
  sint32 angle_turn = 3;
  uint32 buttons = 4;
}
